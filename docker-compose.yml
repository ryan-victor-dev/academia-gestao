# Logs com teto: sem isso, o json-file do Docker cresce para sempre (cada tentativa de
# login vira uma linha) até encher o disco, e guarda e-mails e IPs indefinidamente.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Limites de recursos (revisão de 2026-10-17): o servidor é dividido com outros serviços, e
# só a aplicação tinha teto de memória. Agora todo container tem teto de memória, de CPU e
# de processos: um ataque ou um defeito derruba (e o restart levanta) só o container, sem
# esgotar o servidor. Os principais podem ser ajustados no .env.

# Nenhum processo ganha privilégios depois de iniciar (setuid, capacidades de arquivo).
x-sem-novos-privilegios: &sem-novos-privilegios
  - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    container_name: academia-postgres
    restart: unless-stopped
    logging: *logs
    security_opt: *sem-novos-privilegios
    # Só o que a inicialização do Postgres usa: ajustar o dono dos arquivos e trocar de
    # root para o usuário postgres. O banco em si roda como postgres (uid 70).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Um processo por conexão: 20 da aplicação, o backup e os do próprio Postgres.
    mem_limit: ${POSTGRES_MEMORIA:-1g}
    cpus: ${POSTGRES_CPUS:-2}
    pids_limit: 200
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o .env.example)}
    ports:
      # Só nesta máquina (para rodar a aplicação pelo Maven); nunca na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: academia-app
    restart: unless-stopped
    logging: *logs
    security_opt: *sem-novos-privilegios
    # A aplicação roda sem root (usuário app) e não precisa de nenhuma capacidade do Linux.
    cap_drop: [ALL]
    # Sistema de arquivos só de leitura: mesmo com uma falha grave, ninguém altera o jar
    # nem planta arquivos. Só o /tmp (arquivos temporários do Tomcat) é gravável.
    read_only: true
    tmpfs:
      - /tmp
    # Teto de memória: um ataque pode derrubar a aplicação (que volta sozinha pelo
    # restart: a JVM sai quando a memória acaba, veja o Dockerfile), mas nunca esgotar a
    # memória do servidor inteiro.
    mem_limit: ${APP_MEMORIA:-1g}
    # 2 núcleos: ~30 logins por segundo (o BCrypt é o que mais gasta CPU), de sobra para uma
    # academia, e uma enxurrada de logins não tira CPU dos outros serviços do servidor.
    cpus: ${APP_CPUS:-2}
    # Cada thread da JVM conta como processo (até 200 do Tomcat, mais as da JVM).
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      DB_APP_SENHA: ${DB_APP_SENHA:?defina DB_APP_SENHA no .env}
      # Lidos do arquivo .env (copie de .env.example)
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      JWT_SEGREDO: ${JWT_SEGREDO:-}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-15m}
    ports:
      # Só nesta máquina (diagnóstico); quem vem da rede entra pelo Caddy, com HTTPS.
      - "127.0.0.1:8090:8090"

  # Backup diário do banco (ADR 0020): pg_dump a partir das 3h numa pasta do servidor
  # (BACKUP_PASTA, padrão ./backups), com 7 diários e 4 semanais. Usa o dono do banco: o
  # backup precisa do histórico das migrations, que o usuário da aplicação não lê (sem ele,
  # o banco restaurado não sobe). Não abre porta nenhuma. Copie a pasta para fora do
  # servidor; restaure com scripts/restaurar-backup.sh.
  backup:
    image: postgres:17-alpine
    container_name: academia-backup
    restart: unless-stopped
    logging: *logs
    security_opt: *sem-novos-privilegios
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    # Grava como o seu usuário, para a pasta de backups ser sua e fácil de copiar.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    mem_limit: 512m
    cpus: 1
    pids_limit: 100
    entrypoint: ["sh", "/rotina/rotina.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      PGHOST: postgres
      PGDATABASE: academia
      PGUSER: academia
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      BACKUP_HORA: ${BACKUP_HORA:-3}
    volumes:
      - ./scripts/backup:/rotina:ro
      - ${BACKUP_PASTA:-./backups}:/backups

  # Roda uma vez antes do Caddy: entrega os volumes de certificados ao usuário sem
  # privilégios do Caddy (a imagem oficial os cria como root).
  caddy-permissoes:
    image: caddy:2.11-alpine
    restart: "no"
    logging: *logs
    security_opt: *sem-novos-privilegios
    cap_drop: [ALL]
    # CHOWN para trocar o dono; DAC_READ_SEARCH para entrar nas pastas (700) que, depois da
    # primeira vez, já são do usuário do Caddy, e não do root.
    cap_add: [CHOWN, DAC_READ_SEARCH]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 20
    entrypoint: ["chown", "-R", "10001:10001", "/data", "/config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  caddy:
    image: caddy:2.11-alpine
    container_name: academia-caddy
    restart: unless-stopped
    logging: *logs
    # Sem root: o Caddy é a parte exposta à internet.
    user: "10001:10001"
    security_opt: *sem-novos-privilegios
    # Uma única capacidade: abrir portas abaixo de 1024 (80 e 443). O binário do Caddy vem
    # marcado com ela; sem ela, o kernel nem executa o arquivo.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 1
    pids_limit: 100
    depends_on:
      caddy-permissoes:
        condition: service_completed_successfully
      app:
        condition: service_started
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      HTTP_PORTA: ${HTTP_PORTA:-80}
      HTTPS_PORTA: ${HTTPS_PORTA:-443}
    ports:
      - "${HTTP_PORTA:-80}:${HTTP_PORTA:-80}"
      - "${HTTPS_PORTA:-443}:${HTTPS_PORTA:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chaves do Caddy: sobrevivem a reinícios (evita pedir de novo ao Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
