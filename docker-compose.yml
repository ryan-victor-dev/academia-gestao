services:
  postgres:
    image: postgres:17-alpine
    container_name: academia-postgres
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o .env.example)}
    ports:
      # Só nesta máquina (para rodar a aplicação pelo Maven); nunca na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: academia-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      DB_APP_SENHA: ${DB_APP_SENHA:?defina DB_APP_SENHA no .env}
      # Lidos do arquivo .env (copie de .env.example)
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      JWT_SEGREDO: ${JWT_SEGREDO:-}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-15m}
    ports:
      # Só nesta máquina (diagnóstico); quem vem da rede entra pelo Caddy, com HTTPS.
      - "127.0.0.1:8090:8090"

  caddy:
    image: caddy:2.10-alpine
    container_name: academia-caddy
    depends_on:
      - app
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      HTTP_PORTA: ${HTTP_PORTA:-80}
      HTTPS_PORTA: ${HTTPS_PORTA:-443}
    ports:
      - "${HTTP_PORTA:-80}:${HTTP_PORTA:-80}"
      - "${HTTPS_PORTA:-443}:${HTTPS_PORTA:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chaves do Caddy: sobrevivem a reinícios (evita pedir de novo ao Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: