# Dependabot: abre PRs semanais com atualizações. Os alertas de segurança (CVE) são
# avisados na hora, independentemente desta agenda.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Spring Boot e o que ele gerencia vêm juntos num PR só.
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Imagens declaradas no docker-compose.yml (Postgres e o Caddy das permissões).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Telas (ADR 0033): só versões publicadas há pelo menos 14 dias, como na escolha inicial.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testes:
        patterns: ["vitest", "@testing-library/*", "jsdom"]

  # Imagens do web/Dockerfile (Node da construção e Caddy).
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
