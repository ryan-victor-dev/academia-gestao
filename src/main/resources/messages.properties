# Títulos e mensagens dos erros que o próprio Spring MVC gera (ProblemDetail).
# Chaves: problemDetail.title.<classe da exceção> e problemDetail.<classe da exceção>.

problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Corpo da requisição inválido
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=O JSON está malformado ou tem um valor no formato errado (datas no formato AAAA-MM-DD).

problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Parâmetro inválido
problemDetail.org.springframework.beans.TypeMismatchException=O valor ''{1}'' não é válido para ''{0}''.

problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método não permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=O método {0} não é aceito nesta rota.

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Formato não suportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Envie o corpo como application/json.

problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Rota não encontrada
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Esta rota não existe.
