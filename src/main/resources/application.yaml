spring:
  application:
    name: academia-gestao
  datasource:
    url: jdbc:postgresql://localhost:5432/academia
    username: academia
    password: academia
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8090

academia:
  # Primeiro ADMIN, criado só se o banco ainda não tiver nenhum (ver .env.example).
  admin-inicial:
    nome: ${ADMIN_NOME:}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
