spring:
  application:
    name: academia-gestao
  datasource:
    url: jdbc:postgresql://localhost:5432/academia
    # Usuário da aplicação: só lê e grava dados (ver UsuarioDaAplicacaoNoBanco).
    username: academia_app
    password: ${DB_APP_SENHA:}
  flyway:
    # As migrations rodam com o dono do banco, que pode criar e alterar tabelas.
    user: academia
    password: ${POSTGRES_PASSWORD:}
  mvc:
    # Erros da API no formato padrão RFC 9457 (application/problem+json)
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8090
  # Atrás do Caddy: o Tomcat lê X-Forwarded-For e X-Forwarded-Proto, mas só quando a
  # requisição vem de um proxy interno (rede do Docker, localhost). Assim o limite de
  # login vê o IP real do cliente, e ninguém de fora consegue forjar o próprio IP.
  forward-headers-strategy: native

academia:
  banco:
    senha-app: ${DB_APP_SENHA:}
  # Primeiro ADMIN, criado só se o banco ainda não tiver nenhum (ver .env.example).
  admin-inicial:
    nome: ${ADMIN_NOME:}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  jwt:
    # Chave HMAC em Base64, com pelo menos 32 bytes. Sem ela a aplicação não sobe.
    segredo: ${JWT_SEGREDO:}
    expiracao: ${JWT_EXPIRACAO:15m}
