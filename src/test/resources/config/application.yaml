# Complementa o application.yaml principal só nos testes (classpath:/config/ tem prioridade).
academia:
  jwt:
    # Chave fixa apenas para testes; nunca usar fora daqui.
    segredo: GAYB7ugX/kp/FimZrUYvEDgZp/gNEbVbp6mcsFXnkSY=
  login:
    # Nos testes muitos logins saem do mesmo "IP" em segundos; os limites de verdade
    # são testados em LimiteDeLoginTest, que define os próprios valores.
    tentativas-por-ip: 100000
    falhas-por-conta-e-ip: 100000
    falhas-por-conta-no-total: 100000
  senhas:
    # Muitos testes conferem senhas ao mesmo tempo (o LoginSimultaneoTest, 30 de uma vez); o teto
    # de verdade é testado em SenhasComTetoTest e TetoDeSenhasNaApiTest, com os próprios valores.
    teto: 1000
  requisicoes:
    # Os testes com token simulado são todos do mesmo usuário ("user"); o limite de verdade
    # é testado em LimiteDeRequisicoesTest, que define o próprio valor.
    por-minuto: 1000000
  tokens-invalidos:
    # Os testes mandam tokens inválidos do mesmo "IP" (127.0.0.1); o limite de verdade é
    # testado em LimiteDeTokensInvalidosNaApiTest, que define o próprio valor.
    por-minuto: 1000000
  cobranca:
    # Os testes geram as cobranças das matrículas antigas quando querem (ver
    # CobrancasDaMatriculaTest), e não a cada contexto novo do Spring. Já é o padrão (ADR
    # 0044); fica explícito porque um contexto que a ligasse geraria as de outros testes.
    gerar-das-antigas-ao-subir: false
  banco:
    # Senha do usuário academia_app no Postgres descartável dos testes.
    senha-app: senha-do-app-so-para-testes
spring:
  flyway:
    # O Testcontainers só cria o usuário "test", que é o dono do banco de testes.
    user: test
    password: test
